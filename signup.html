<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Marvel Koshari</title>
        <link rel="icon" type="jpg/png" href="imgs/marvel1.png">
        <link rel="stylesheet" href="Koshari.css">
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </head>

    <body>

        <div class="header">
            <div class="container">
                <div class="rest-logo"><a href=""><img src="imgs/marvel1.png" alt=""></a></div>
                <div class="nav_data">
                    <span><a href="index.html"><i class="fa-solid fa-house"></i> <span class="s">الرئيسية</span></a></span>
                    <span><a href="aboutus.html"><i class="fa-solid fa-address-card"></i> <span class="s">من
                                نحن</span></a></span>

                    <span><a href="branches.html"><i class="fa-solid fa-code-branch"></i> <span
                                class="s">فروعنا</span></a></span>
                    <span><a href="contactus.html"><i class="fa-regular fa-address-card"></i> <span class="s">تواصل
                                معنا</span></a></span>
                    <span><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> <span class="s">تسجيل
                                الدخول</span></a></span>
                </div>
            </div>
        </div>
        
        <div class="signup">
            <div class="container">
                <div class="signup-page">
                    <div class="signup">
                        <h2>Sign Up</h2>
                        <div class="social">
                            <a href=""><i class="fa-brands fa-facebook"></i></a>
                            <a href=""><i class="fa-brands fa-google"></i></a>
                        </div>
                    
                        <p>or</p>
                    
                        <form id="signup-form" method="POST" action="">
                            <label for="First Name">First Name:</label>
                            <input type="text" id="firstname" placeholder="First Name" name="First Name" required>

                            <label for="username">Username:</label>
                            <input type="text" id="username" placeholder="User Name" name="username" required>

                            <label for="email">Email:</label>
                            <input type="email" id="email" placeholder="Email Address" name="email" required>

                            <label for="password">Password:</label>
                            <!-- Password Field -->
                            <div class="password-field">

                                <input type="password" id="signup-pass" name="signup-pass" placeholder="Password" required>
                                <i class="fa-solid fa-eye-slash" id="toggle-password"></i>
                            </div>

                            <label for="password">Confirm Password:</label>
                            <!-- Confirm Password Field -->
                            <div class="password-field">
                                <input type="password" id="confirm-pass" name="confirm-pass" placeholder="Confirm Password" required>
                                <i class="fa-solid fa-eye-slash" id="toggle-confirm-password"></i>
                            </div>
                            <!-- Error message -->
                            <span id="pass-msg" style="color: red;margin-top: 10px;"></span>
                            <br>
                            <button class="button_signup" type="submit">Sign Up</button>
                        </form>
                        <p>Already have an account? <a href="login.html">Login</a></p>
                    </div>
                    
        
            
                </div>
            </div>
        </div>


        <div class="footer">
            <div class="container">
                <div class="email">
                    <input type="email" name="" id="" placeholder="البريد الالكتروني">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="box">
                    <p>كن على إطلاع بأحداثنا ؟</p>
                    <p>إشترك بالبريد الإلكتروني ليصلك جديد الأخبار</p>
                </div>
                <div class="line"></div>
            </div>
            <div class="social">
                <a href=""><i class="fa-brands fa-facebook"></i></a>
                <a href=""><i class="fa-brands fa-twitter"></i></a>
                <a href=""><i class="fa-brands fa-instagram"></i></a>
            </div>
            <div class="copy">
                <div class="container">
                    <div class="rest-logo"><a href=""><img src="imgs/marvel1.png" alt=""></a></div>
                    <p>2024 Marvel Koshary جميع الحقوق محفوظة لـ &copy</p>
                </div>
            </div>
        </div>
        <script src="JS Files/signup.js"></script>
    </body>
