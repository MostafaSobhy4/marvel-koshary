<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Marvel Koshari</title>
        <link rel="icon" type="jpg/png" href="imgs/marvel1.png">
        <link rel="stylesheet" href="Koshari.css">
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </head>

    <body>

        <div class="header">
            <div class="container">
                <div class="rest-logo"><a href=""><img src="imgs/marvel1.png" alt=""></a></div>
                <div class="nav_data">
                    <span><a href="index.html"><i class="fa-solid fa-house"></i> <span class="s">الرئيسية</span></a></span>
                    <span><a href="aboutus.html"><i class="fa-solid fa-address-card"></i> <span class="s">من
                                نحن</span></a></span>

                    <span><a href="branches.html"><i class="fa-solid fa-code-branch"></i> <span
                                class="s">فروعنا</span></a></span>
                    <span><a href="contactus.html"><i class="fa-regular fa-address-card"></i> <span class="s">تواصل
                                معنا</span></a></span>
                    <span><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> <span class="s">تسجيل
                                الدخول</span></a></span>
                </div>
            </div>
        </div>

        <div class="login">
            <div class="container">
                <div class="login-page">
                    <h2>Login </h2>
                    <form id="login-form" method="POST" action="">

                        <label for="log-username">Username:</label>
                        <input type="text" id="log-username" name="log-username" placeholder="User Name" required>
                        <br>

                        <label for="log-password">Password:</label>
                        <div class="password-field">
                            <input type="password" id="log-password" name="log-password" placeholder="Password" required>
                            <i class="fa-solid fa-eye-slash" id="toggle-password"></i>
                        </div>
                        <span id="pass-msg" style="color: red;"></span>
                        <br>
                        <button type="submit">Login</button>
                    </form>
                    <p>You don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="container">
                <div class="email">
                    <input type="email" name="" id="" placeholder="البريد الالكتروني">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="box">
                    <p>كن على إطلاع بأحداثنا ؟</p>
                    <p>إشترك بالبريد الإلكتروني ليصلك جديد الأخبار</p>
                </div>
                <div class="line"></div>
            </div>
            <div class="social">
                <a href=""><i class="fa-brands fa-facebook"></i></a>
                <a href=""><i class="fa-brands fa-twitter"></i></a>
                <a href=""><i class="fa-brands fa-instagram"></i></a>
            </div>
            <div class="copy">
                <div class="container">
                    <div class="rest-logo"><a href=""><img src="imgs/marvel1.png" alt=""></a></div>
                    <p>2024 Marvel Koshary جميع الحقوق محفوظة لـ &copy</p>
                </div>
            </div>
        </div>
        <script src="all.js"></script>
    </body>
